server:
  listen: 127.0.0.1:8080
  public_origin: http://10.66.66.1
  mode: vpn_http
  trusted_proxies: [127.0.0.1]
auth:
  password_hash: REPLACE_WITH_PERSISTTY_PASSWORD_OUTPUT
  session_ttl: 168h
storage:
  path: /var/lib/persistty/metadata.db
transfer:
  staging_path: /var/lib/persistty/staging
  max_file_bytes: 268435456
  max_batch_bytes: 1073741824
  max_staging_bytes: 2147483648
  chunk_bytes: 4194304
  upload_ttl: 24h
  archive_ttl: 1h
terminal:
  tmux_binary: /usr/bin/tmux
  # 不设置 shell 时使用服务用户的登录 shell，检测失败回退 /bin/sh。
  # shell: /usr/bin/zsh
  socket_path: /var/lib/persistty/tmux.sock
  history_lines: 5000
  restore_lines: 5000
  history_bytes: 8388608
  termination_seconds: 10
search:
  binary: /usr/bin/rg
  timeout_seconds: 15
  max_entries: 50000
  max_results: 5000
  max_bytes: 67108864
  exclude_directories: [node_modules, dist, .next, vendor]
git:
  binary: /usr/bin/git
  max_bytes: 536870912
elevation:
  # 默认禁用；完成独立授权安装及真实 sudo/PAM 验收后才开启。
  enabled: false
  socket_path: /run/persistty-elevation/broker.sock
