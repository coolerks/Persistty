# 在现有 Nginx 主配置的 http {} 中 include /opt/persistty/nginx.conf;
# LAN_IP 由安装器替换为首次 --host 参数；不要直接 include 本模板。
server {
    listen LAN_IP:80;
    server_name LAN_IP;
    root /opt/persistty/current/web;
    index index.html;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_in_file_only off;
    client_body_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/v1/auth/login {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    # 8MiB文本JSON最坏6倍转义+元数据；后端仍按自己的资源上限裁决。
    location /api/ {
        client_max_body_size 49m;
        client_body_buffer_size 49m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ "^/api/v1/(events|terminals/[^/]+/stream)$" {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 默认4MiB分块，5m留协议余量；改变后端chunk_bytes时同步这里。
    location ~ "^/api/v1/uploads/[^/]+/chunks/[0-9]+$" {
        client_max_body_size 5m;
        client_body_buffer_size 5m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # W07 的准备和执行都含冻结正文；execute 还含系统口令。
    # 单 JSON 上限 6*8MiB+8192，49m 内存缓冲覆盖转义最坏情况。
    # W07默认关闭；不在普通安装脚本中安装sudo/PAM链。
    location ~ "^/api/v1/(projects/[^/]+/folders/[^/]+/elevation-requests|elevation-requests/[a-f0-9]{64}/execute)$" {
        client_max_body_size 49m;
        client_body_buffer_size 49m;
        client_body_in_file_only off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /login {
        try_files /index.html =404;
    }

    location = /projects {
        try_files /index.html =404;
    }

    location = /terminals {
        try_files /index.html =404;
    }

    location ~ ^/(projects|terminals)/[^/]+$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
