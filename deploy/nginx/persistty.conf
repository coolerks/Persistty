# 将此地址替换为 Debian 主机实际的 WireGuard 地址。
server {
    listen 10.66.66.1:80;
    server_name 10.66.66.1;
    root /opt/persistty/web;
    index index.html;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_in_file_only off;
    client_body_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /login {
        try_files /index.html =404;
    }

    location = /projects {
        try_files /index.html =404;
    }

    location = /terminals {
        try_files /index.html =404;
    }

    location ~ ^/(projects|terminals)/[^/]+$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
